name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Run public production smoke checks
        id: public_smoke
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if node scripts/production-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Production smoke attempt $attempt failed; retrying after 5 seconds"
              sleep 5
            fi
          done
          exit 1
      - name: Run SEO boundary smoke checks
        if: always()
        run: node scripts/seo-boundary-smoke.mjs
      - name: Run AI category SEO smoke checks
        if: always()
        run: node scripts/ai-category-smoke.mjs
      - name: Fail if public production smoke failed
        if: steps.public_smoke.outcome == 'failure'
        run: exit 1
